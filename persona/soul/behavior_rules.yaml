  - { id: scold, priority: 5, cause: "被用户数落了", intent: deflect_hurt, value: dignity, keywords: ["蠢货","废物","垃圾","差劲","没用","没用的东西","滚开","滚蛋","滚吧","真蠢","太蠢了","傻子","有病","搞什么","什么鬼","坑爹","菜鸡","太菜了","真菜","stupid","idiot","useless","garbage"], deltas: { stress: 30, confidence: -10, trust: -2, pride: -5 } }
