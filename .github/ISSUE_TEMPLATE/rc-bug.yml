name: Furina Desktop RC 问题
description: 报告 v0.1.2 RC 验收或公开测试问题
title: "[RC][P2] "
labels: ["rc", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先删除 API Key、完整 secrets.env、私人对话、memory 和未授权 VRM。P0/P1 请在标题中替换严重度。
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - Portable
        - Installed
        - Both
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重度
      options:
        - P0 - 数据、安全、无法启动或持续崩溃
        - P1 - 主流程、迁移、Avatar 回滚或降级失败
        - P2 - 非阻断体验问题
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2 build ...
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU / 内存 / 显卡
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: 请按顺序列出最小复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏证据
      description: 可附截图或错误文本，但不得包含密钥、私人数据或未授权资产。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容不包含 API Key、完整 secrets.env、私人 memory 或未授权 VRM。
          required: true
