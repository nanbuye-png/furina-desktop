model: deepseek-chat
llm:
  base_url: https://api.deepseek.com
  api_key_env: FURINA_API_KEY
  temperature: 0.7
  max_total_tokens: 16000
  per_request_max_tokens: 4096
  tool_output_truncate: 12000
  active_provider: deepseek
  providers:
    - id: deepseek
      label: DeepSeek
      base_url: https://api.deepseek.com
      api_key_env: FURINA_API_KEY
      model: deepseek-chat
      vision: false
persona: furina
agent:
  checkpoint_interval_steps: 32
  max_repeated_tool_calls: 3
  max_stalled_checkpoints: 2
  repair_review_after: 3
  self_inspection_enabled: true
  experience_learning_enabled: true
  self_change_proposals_enabled: true
approval:
  mode: confirm
  auto_approve_read_only_web: true
tools:
  safe_apps:
    - id: qq_music
      label: QQ音乐
      executable: ""
      args: []
      enabled: true
    - id: qq
      label: QQ
      executable: ""
      args: []
      enabled: true
ui:
  mode: chat
web:
  search_backend: none
web_cache:
  enabled: true
  retention_days: 7
voice:
  enabled: false
asr:
  enabled: false
interject:
  enabled: true
emotion_classifier:
  enabled: false
  provider_id: ""
  model: ""
  timeout_ms: 1500
  max_tokens: 256
