[workspace]
resolver = "2"
members = [
    "crates/furina-proto",
    "crates/furina-core",
    "crates/furina-soul",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.1"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "process", "sync", "time", "signal", "fs", "net"] }

[profile.dev]
opt-level = 1
